name: CI

on:
  push:
    branches: [main, "sdlc/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests
        run: |
          pytest tests/ --tb=short -v --cov=researcher_support_agent --cov-report=term-missing

      - name: Check typing (mypy)
        run: |
          pip install mypy
          mypy src/researcher_support_agent/ --ignore-missing-imports --strict

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for known vulnerabilities
        run: safety check --json || true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run end-to-end tests
        run: |
          pytest tests/test_e2e_pipeline.py --tb=short -v
